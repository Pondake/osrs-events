<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Brand palette taken from public/osrs-events-10a.svg: dark tile #1C1919,
       gold #D9B45E, checkerboard #272121/#332B2B. Keep these in sync with the
       logo — this is the first impression on every Discord and Twitter share. -->
  <defs>
    <pattern id="checker" width="136" height="136" patternUnits="userSpaceOnUse">
      <rect width="136" height="136" fill="#1C1919"/>
      <rect width="68" height="68" fill="#221D1D"/>
      <rect x="68" y="68" width="68" height="68" fill="#221D1D"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1919" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#141010" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#checker)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- Board motif: 5x5 grid echoing the logo tile, with one ladder and one snake -->
  <g transform="translate(792 150)">
    <g stroke="#141010" stroke-width="1.6">
      <rect x="0"   y="0"   width="58" height="58" rx="6" fill="#272121"/>
      <rect x="68"  y="0"   width="58" height="58" rx="6" fill="#332B2B"/>
      <rect x="136" y="0"   width="58" height="58" rx="6" fill="#272121"/>
      <rect x="204" y="0"   width="58" height="58" rx="6" fill="#332B2B"/>

      <rect x="0"   y="68"  width="58" height="58" rx="6" fill="#332B2B"/>
      <rect x="68"  y="68"  width="58" height="58" rx="6" fill="#272121"/>
      <rect x="136" y="68"  width="58" height="58" rx="6" fill="#332B2B"/>
      <rect x="204" y="68"  width="58" height="58" rx="6" fill="#272121"/>
      <rect x="272" y="68"  width="58" height="58" rx="6" fill="#332B2B"/>

      <rect x="0"   y="136" width="58" height="58" rx="6" fill="#272121"/>
      <rect x="68"  y="136" width="58" height="58" rx="6" fill="#332B2B"/>
      <rect x="136" y="136" width="58" height="58" rx="6" fill="#272121"/>
      <rect x="204" y="136" width="58" height="58" rx="6" fill="#332B2B"/>
      <rect x="272" y="136" width="58" height="58" rx="6" fill="#272121"/>

      <rect x="0"   y="204" width="58" height="58" rx="6" fill="#332B2B"/>
      <rect x="68"  y="204" width="58" height="58" rx="6" fill="#272121"/>
      <rect x="136" y="204" width="58" height="58" rx="6" fill="#332B2B"/>
      <rect x="204" y="204" width="58" height="58" rx="6" fill="#272121"/>
      <rect x="272" y="204" width="58" height="58" rx="6" fill="#332B2B"/>

      <rect x="0"   y="272" width="58" height="58" rx="6" fill="#272121"/>
      <rect x="136" y="272" width="58" height="58" rx="6" fill="#272121"/>
      <rect x="204" y="272" width="58" height="58" rx="6" fill="#332B2B"/>
      <rect x="272" y="272" width="58" height="58" rx="6" fill="#272121"/>
    </g>

    <!-- ladder foot -->
    <rect x="68" y="272" width="58" height="58" rx="6" fill="#22c55e" fill-opacity="0.20" stroke="#22c55e" stroke-width="2.5"/>
    <!-- snake head -->
    <rect x="204" y="0" width="58" height="58" rx="6" fill="#ef4444" fill-opacity="0.20" stroke="#ef4444" stroke-width="2.5"/>
    <!-- finish tile, gold like the logo border -->
    <rect x="272" y="0" width="58" height="58" rx="6" fill="#D9B45E" fill-opacity="0.30" stroke="#D9B45E" stroke-width="2.5"/>

    <path d="M 97 272 L 97 136" stroke="#22c55e" stroke-width="3.5" stroke-opacity="0.85" stroke-linecap="round"/>
    <path d="M 97 136 l -9 10 M 97 136 l 9 10" stroke="#22c55e" stroke-width="3.5" stroke-opacity="0.85" stroke-linecap="round" fill="none"/>

    <path d="M 233 58 C 233 130, 165 130, 165 194" stroke="#ef4444" stroke-width="3.5" stroke-opacity="0.85" stroke-linecap="round" fill="none"/>
    <path d="M 165 194 l -9 -10 M 165 194 l 9 -10" stroke="#ef4444" stroke-width="3.5" stroke-opacity="0.85" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Trophy mark, lifted straight from the logo so the two never drift -->
  <g transform="translate(67.6 107.6) scale(1.46)">
    <path d="M14 18 L24 20 L28 38 L18 34 Z" fill="#8F6A24"/>
    <path d="M86 18 L76 20 L72 38 L82 34 Z" fill="#8F6A24"/>
    <path d="M24 14 L76 14 L70 46 L50 62 L30 46 Z" fill="#D9B45E"/>
    <path d="M50 14 L76 14 L70 46 L50 62 Z" fill="#B8933F"/>
    <path d="M24 14 L76 14 L74 22 L26 22 Z" fill="#F0D48C"/>
    <path d="M45 60 L55 60 L55 80 L45 80 Z" fill="#8F6A24"/>
    <path d="M45 60 L50 60 L50 80 L45 80 Z" fill="#D9B45E"/>
    <path d="M30 80 L70 80 L76 96 L24 96 Z" fill="#F1E6CE"/>
    <path d="M50 80 L70 80 L76 96 L50 96 Z" fill="#D0C4A8"/>
  </g>

  <g transform="translate(88 0)">
    <text y="352" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#D9B45E" letter-spacing="1">OSRS Events</text>

    <text y="412" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#F1E6CE">Snakes &amp; Ladders boards for</text>
    <text y="454" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#F1E6CE">Old School RuneScape clans</text>

    <text y="524" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#9A8A72">Free &#8226; No ads &#8226; Discord login</text>
  </g>

  <rect x="0" y="620" width="1200" height="10" fill="#D9B45E"/>
</svg>
