name: Bug report
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report a security problem here — see [SECURITY.md](https://github.com/Pondake/osrs-events/blob/develop/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the app did in response.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in the app
      options:
        - Snakes & ladders board
        - Skill race
        - Drop race
        - Bingo
        - Notifications / push
        - Login or account
        - Admin
        - Somewhere else / not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 142 on Windows 11, or Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Screenshots, console errors, the event URL. Do not paste tokens,
        invite links or anything else you would not post publicly.
    validations:
      required: false
