name: Feature request
description: Suggest something the app should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a solo hobby project, so a reply can take a while and not
        everything will be built. Describing the problem you ran into is more
        useful than describing a solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What were you trying to do when you hit this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - Snakes & ladders board
        - Skill race
        - Drop race
        - Bingo
        - Notifications / push
        - Login or account
        - Admin
        - Something new
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds, or how other tools handle it.
    validations:
      required: false
